spring.application.name=backend
# ========================
# Configuración del Servidor
# ========================
server.port=8080

# ========================
# Configuración de MySQL
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_citas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# Configuración JPA/Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# Configuración JWT
# ========================
jwt.secret=miClaveSecretaSuperSeguraParaJWT2024ProyectoEsftec
jwt.expiration=86400000

# ========================
# Configuración CORS
# ========================
spring.web.cors.allowed-origins=http://localhost:3000

# ========================
# Configuración de logs
# ========================
logging.level.org.springframework.security=DEBUG
logging.level.com.proyecto3=DEBUG
